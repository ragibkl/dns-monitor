name: dns-monitor Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Quick checks that need no compile: formatting, and RustSec advisories
  # against Cargo.lock (also run daily by advisories.yml).
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Use the same Rust version as .tool-versions, so local checks and CI agree.
      - name: Read Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --check

      - name: Security advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  # Runs before anything is published. Images are pushed on pull requests too,
  # so without this gate a PR image could be deployed against the real
  # resolvers without its tests having run once.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Reuses the image's own toolchain, so the tests run against the same
      # Alpine/musl target that ships, and the compile is cached for the
      # publish job below rather than paid for twice.
      - name: Build builder stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: builder
          load: true
          tags: dns-monitor:ci-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests and clippy
        run: |
          docker run --rm dns-monitor:ci-builder sh -c '
            apk add --quiet rust-clippy &&
            cargo test --release &&
            cargo clippy --all-targets --release -- -D warnings
          '

  build:
    # Nothing is published unless the checks above pass.
    needs: [lint, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # ghcr with GITHUB_TOKEN, so this needs no repository secrets.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ragibkl/dns-monitor
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - uses: docker/setup-buildx-action@v4

      # Published on pull requests too, as ghcr.io/ragibkl/dns-monitor:pr-<n>,
      # so a change can be run against the real resolvers from a scratch
      # Deployment before it reaches main. Matches simplesolat-api and
      # dnsdist-acme, which both publish unconditionally.
      - uses: docker/build-push-action@v7
        with:
          context: .
          cache-from: type=gha
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
