[package]
name = "dns-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hickory-proto = "0.26"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "query"] }
rustls = "0.23"
rustls-platform-verifier = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"
x509-parser = "0.18"
